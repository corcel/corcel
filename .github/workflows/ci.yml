name: CI

on: [push]

jobs:
  build-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1

    - name: Setup php82
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Running tests php82
      run: |
        composer install --prefer-dist --quiet
        php vendor/bin/phpunit

    - name: Setup php82
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Running tests php83
      run: |
        composer install --prefer-dist --quiet
        php vendor/bin/phpunit

    - name: Setup php84
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Running tests php84
      run: |
        composer install --prefer-dist --quiet
        php vendor/bin/phpunit